<!DOCTYPE html>
<html lang="en" data-theme="kilo-vscode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilo Code</title>
  <!-- VS Code theme variables (must be loaded before kilo-ui styles) -->
  <link rel="stylesheet" href="vscode-theme.css">
  <!-- Kilo UI styles -->
  <link rel="stylesheet" href="webview.css">
  <style>
    :root {
      --kilo-font-size-10: 10,00px;
      --kilo-font-size-11: 11,00px;
      --kilo-font-size-12: 12,00px;
      --kilo-font-size-13: 13,00px;
      --kilo-font-size-14: 14,00px;
      --kilo-font-size-15: 15,00px;
      --kilo-font-size-16: 16,00px;
      --kilo-font-size-17: 17,00px;
      --kilo-font-size-18: 18,00px;
      --kilo-font-size-19: 19,00px;
      --kilo-font-size-20: 20,00px;
      --kilo-font-size-21: 21,00px;
      --kilo-font-size-22: 22,00px;
      --kilo-font-size-23: 23,00px;
      --kilo-font-size-24: 24,00px;
      --kilo-font-scale: 1,00;
      --font-size-x-small: var(--kilo-font-size-10);
      --font-size-small: var(--kilo-font-size-11);
      --font-size-base: var(--kilo-font-size-13);
      --font-size-large: var(--kilo-font-size-16);
    }

    html {
      scrollbar-color: auto;

      ::-webkit-scrollbar-thumb {
        border: 3px solid transparent !important;
        background-clip: padding-box !important;
      }
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      height: 100% !important;
      width: 100% !important;
      overflow: hidden !important;
      background-color: var(--background-base, var(--vscode-editor-background, #1e1e1e)) !important;
      color: var(--text-strong, var(--vscode-editor-foreground, #d4d4d4)) !important;
      font-family: var(--vscode-font-family, "Segoe UI", Tahoma, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }

    #root {
      width: 100% !important;
      height: 100% !important;
    }
    /* Apply VS Code theme bridge */
    html[data-theme="kilo-vscode"] {
      color-scheme: normal;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Set icon base URI for bundled icons -->
  <script>window.ICONS_BASE_URI = "."; window.KILO_SHIKI_WORKER_URI = "shiki-worker.js";</script>
  <!-- VS Code API compatibility layer for WebView2 -->
  <script src="vscode-api.js"></script>
  <script src="webview.js"></script>
</body>
</html>
